<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sabbir Ahmed — Senior Software Engineer</title>
    <script>
      // Redirect unknown paths back to index.html with path encoded in query string
      // so BrowserRouter can handle client-side routing on GitHub Pages.
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
